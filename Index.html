<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Question 💖</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: linear-gradient(135deg, #ffd6e7, #dcd6ff);
}

.card {
  width: 90%;
  max-width: 400px;
  padding: 35px 25px;
  text-align: center;
  background: rgba(255,255,255,0.9);
  border-radius: 25px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.15);
  position: relative;
  z-index: 2;
}

.heart {
  font-size: 70px;
  animation: beat 1s infinite;
}

@keyframes beat {
  50% {
    transform: scale(1.15);
  }
}

h1 {
  color: #e83e75;
  margin: 15px 0;
}

p {
  color: #555;
  font-size: 18px;
  line-height: 1.5;
}

button {
  border: none;
  padding: 14px 25px;
  margin: 10px;
  border-radius: 30px;
  font-size: 17px;
  cursor: pointer;
  transition: 0.2s;
}

#yes {
  background: #ff4f87;
  color: white;
}

#maybe {
  background: #eee;
  color: #555;
}

button:active {
  transform: scale(0.9);
}

#result {
  display: none;
}

.floating-heart {
  position: absolute;
  bottom: -30px;
  font-size: 25px;
  animation: float 6s linear infinite;
  opacity: 0.7;
}

@keyframes float {
  from {
    transform: translateY(0);
    opacity: 0.8;
  }
  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card" id="main">
  <div class="heart">❤️</div>

  <h1>A Little Question...</h1>

  <p>
    You make my days a little brighter,
    and I wanted to ask you something special.
  </p>

  <h1>Will you be my special person? 💖</h1>

  <button id="yes" onclick="sayYes()">Yes ❤️</button>
  <button id="maybe" onclick="moveButton()">Maybe 😊</button>
</div>

<div class="card" id="result">
  <div class="heart">💖</div>
  <h1>Yay! 🎉</h1>
  <p>
    Thank you for saying yes! 😊
  </p>
  <p>
    Here's to lots of happy moments ahead! ✨
  </p>
</div>

<script>

function sayYes() {
  document.getElementById("main").style.display = "none";
  document.getElementById("result").style.display = "block";

  for (let i = 0; i < 30; i++) {
    createHeart();
  }
}

function moveButton() {
  const button = document.getElementById("maybe");

  const maxX = window.innerWidth - button.offsetWidth - 20;
  const maxY = window.innerHeight - button.offsetHeight - 20;

  button.style.position = "fixed";
  button.style.left = Math.random() * maxX + "px";
  button.style.top = Math.random() * maxY + "px";
}

function createHeart() {
  const heart = document.createElement("div");

  heart.className = "floating-heart";
  heart.innerHTML = ["❤️","💖","💕","💗","✨"][Math.floor(Math.random() * 5)];

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (3 + Math.random() * 4) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 7000);
